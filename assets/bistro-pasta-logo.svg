<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bistro Pasta logo</title>
  <desc id="desc">Orange background with a rolling pin outline and text Bistro Pasta, Макароношная с акцентом</desc>
  <rect width="1200" height="400" fill="#EE4620"/>
  <rect x="120" y="140" width="960" height="120" fill="#EE4620" stroke="#FFFFFF" stroke-width="12" rx="12"/>
  <rect x="-40" y="175" width="160" height="50" fill="#EE4620" stroke="#FFFFFF" stroke-width="12" rx="12"/>
  <rect x="1080" y="175" width="160" height="50" fill="#EE4620" stroke="#FFFFFF" stroke-width="12" rx="12"/>
  <rect x="160" y="170" width="880" height="80" fill="#FFFFFF" rx="8"/>
  <text x="600" y="230" text-anchor="middle" fill="#EE4620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="2">BISTRO PASTA</text>
  <text x="600" y="310" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" letter-spacing="2">МАКАРОНОШНАЯ С АКЦЕНТОМ</text>
</svg>
